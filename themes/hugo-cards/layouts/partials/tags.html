<div class= "panel sidebar-menu">
    <ul class="tag-cloud">
    {{ $currentTags := .Params.tags }}
    {{ range $name, $items := .Site.Taxonomies.tags }}
  
    <li>
        <a href='{{ "tags/" | relLangURL }}{{ $name | urlize | lower }}/'>
          <i class="fa fa-tag"></i> {{ $name }}
        </a>
    </li>
    {{ end }}
    </ul>
  </div>
