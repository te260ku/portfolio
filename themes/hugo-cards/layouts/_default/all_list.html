<!-- {{ $paginator := .Paginate (where .Site.RegularPages "Section" "posts") 30}} -->
{{ range first 30 (where .Site.RegularPages "Section" "posts")}}   
        
<div class="col-md-4 card">
 <a href="{{ .Permalink }}" class="index-anchor"> 
  <!-- <a href="" data-toggle="modal" data-target="#Modal" class="index-anchor"> -->
    <div class="panel panel-default">
      
      <div class="card-image">
      {{ if .Params.img }}
      <img width="100%" height="100%" src="{{ .Site.BaseURL }}/images/{{ .Params.img }}" alt="{{ .Title }}">
      {{ else }}
      <img width="100%" src="{{ .Site.BaseURL }}/images/{{ .Site.Params.defaultImage }}" alt="{{ .Site.Title }}">
      {{ end }}
      </div>
      
      <div class="panel-body">
        <!-- <h3 class="panel-title pull-left">{{ .Title | truncate 25 }}</h3><span class="post-meta pull-right"><small>{{ .Date.Format "January 2, 2006" }}</small></span> -->
        <h3 class="panel-title pull-left">{{ .Title | truncate 50 }}</h3>
      </div>
      
      <div class="panel-body"><small>
        {{ .Summary | plainify | truncate 180 }}</small>
      </div>
    </div>
    </a>
</div>

{{ end }}
