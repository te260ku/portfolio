            <p>空間の幾何情報を活用したインタラクティブなMRゲーム。部屋の壁や床にボールを当ててスカッシュをプレイする。</p>
<p>壁にボールを当てた際に、衝突音と壁の色を動的に変化させることで、周囲の空間と対話するというゲームにおける新たなゲームコンテンツを検討した。色と音の変化は両者における共感覚の原理をベースに対応づけを行った。制作にはMagic Leap Oneを用いた。</p>
